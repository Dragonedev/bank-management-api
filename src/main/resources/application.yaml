server:
  port: 8080

spring:
  application:
    name: spring-boot-bank-management

  datasource:
    url: jdbc:postgresql://localhost:5432/bank_management_db
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

